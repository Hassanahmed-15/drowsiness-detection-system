# Config F (midterm) - adaptive EAR + eyeBlink blendshape score fusion (needs non-V1 field)
# weight and threshold tuned on all DEV videos
name: F_ear_adaptive_blendshape_w0.5
classifier:
  method: ear_adaptive_blendshape
  weight: 0.5
  fused_threshold: 0.5
  k: 0.425
  window_frames: 900
  percentile: 80
  warmup_frames: 30
  fallback_threshold: 0.13
  min_threshold: 0.1
  max_threshold: 0.35
  fusion: mean
blink:
  min_closed_frames: 1
  max_blink_ms: 500
  max_gap_frames: 2
crop:
  size: 32
  scale: 1.6

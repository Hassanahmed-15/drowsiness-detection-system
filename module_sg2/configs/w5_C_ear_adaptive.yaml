# Config C - EAR, per-driver adaptive threshold k x open-eye EAR (80th pct, last 30 s)
# Generated by experiments/evaluate.py (threshold tuned on DEV videos ['talking', 'eb8_01', 'eb8_02', 'eb8_03'])
name: C_ear_adaptive_k0.425
classifier:
  method: ear_adaptive
  k: 0.425
  window_frames: 900
  percentile: 80
  warmup_frames: 30
  fallback_threshold: 0.13
  min_threshold: 0.1
  max_threshold: 0.35
  fusion: mean
blink:
  min_closed_frames: 1
  max_blink_ms: 500
  max_gap_frames: 2
crop:
  size: 32
  scale: 1.6

# Config D - Learned CNN on 32x32 eye crop (MRL+CEW trained, ONNX)
# Generated by experiments/evaluate.py (threshold tuned on DEV videos ['talking', 'eb8_01', 'eb8_02', 'eb8_03'])
name: D_cnn_p0.995
classifier:
  method: cnn
  threshold: 0.995
  model_path: models/eye_state_cnn.onnx
blink:
  min_closed_frames: 1
  max_blink_ms: 500
  max_gap_frames: 2
crop:
  size: 32
  scale: 1.6

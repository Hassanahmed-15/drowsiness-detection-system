# BACKUP (midterm, 2026-10-25) = Config C: per-driver adaptive EAR, no model file needed.
# Evidence: results/midterm/comparison.csv - TEST closed-frame F1 0.918 (95% CI 0.842-0.962), blink F1 0.944.
# Same pipeline as the primary without the CNN check: numpy + OpenCV only, runs anywhere.
name: BACKUP_C_ear_adaptive_k0.425
classifier:
  method: ear_adaptive
  k: 0.425
  window_frames: 900
  percentile: 80
  warmup_frames: 30
  fallback_threshold: 0.13
  min_threshold: 0.1
  max_threshold: 0.35
  fusion: mean
blink:
  min_closed_frames: 1
  max_blink_ms: 500
  max_gap_frames: 2
crop:
  size: 32
  scale: 1.6
